name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (Full Clone)
        uses: actions/checkout@v4  # Updated from v2
        with:
          fetch-depth: 0  # Disables shallow clone

      - name: Set up Python
        uses: actions/setup-python@v4  # Updated from v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: bee-san_pyWhat
          SONAR_ORGANIZATION: oss-evaluation
          SONAR_PYTHON_VERSION: "3.9"  # Explicit Python version
